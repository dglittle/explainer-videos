<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spinor Rotation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
if (!gl) { document.body.innerHTML = '<h1 style="color:white;padding:40px">WebGL not supported</h1>'; }

// --- Board shader (deformation in vertex shader) ---
const boardVS = `
attribute vec2 aGrid;
attribute float aCheck;
uniform mat4 uMVP;
uniform float uAng;
uniform float uInnerR;
uniform float uOuterR;
varying vec3 vNormal;
varying float vCheck;
varying vec2 vUV;

vec3 deform(vec2 p) {
  float dist = length(p);
  if (dist >= uOuterR) return vec3(p, 0.0);
  float falloff;
  if (dist <= uInnerR) {
    falloff = 1.0;
  } else {
    falloff = 1.0 - (dist - uInnerR) / (uOuterR - uInnerR);
    falloff = falloff * falloff * (3.0 - 2.0 * falloff);
  }
  float ang = uAng;
  float tilt = 3.14159265 * falloff;
  float ct, st;
  vec3 q = vec3(p, 0.0);
  ct = cos(-tilt); st = sin(-tilt);
  q = vec3(q.x, q.y*ct - q.z*st, q.y*st + q.z*ct);
  ct = cos(-ang); st = sin(-ang);
  q = vec3(q.x*ct - q.y*st, q.x*st + q.y*ct, q.z);
  ct = cos(tilt); st = sin(tilt);
  q = vec3(q.x, q.y*ct - q.z*st, q.y*st + q.z*ct);
  ct = cos(ang); st = sin(ang);
  q = vec3(q.x*ct - q.y*st, q.x*st + q.y*ct, q.z);
  return q;
}

void main() {
  vec3 pos = deform(aGrid);
  gl_Position = uMVP * vec4(pos, 1.0);
  float eps = 0.002;
  vec3 dx = deform(aGrid + vec2(eps, 0.0)) - deform(aGrid - vec2(eps, 0.0));
  vec3 dy = deform(aGrid + vec2(0.0, eps)) - deform(aGrid - vec2(0.0, eps));
  vNormal = normalize(cross(dx, dy));
  vCheck = aCheck;
  vUV = aGrid * 0.5;
}`;

const boardFS = `
precision mediump float;
varying vec3 vNormal;
varying float vCheck;
varying vec2 vUV;
uniform vec3 uLightDir;
uniform vec3 uLightDir2;

// Hash to get a random value per tile
float hash1(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

// HSL to RGB conversion
vec3 hsl2rgb(float h, float s, float l) {
  vec3 rgb = clamp(abs(mod(h * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
  return l + s * (rgb - 0.5) * (1.0 - abs(2.0 * l - 1.0));
}

void main() {
  vec3 n = normalize(vNormal);
  float diff1 = abs(dot(n, uLightDir));
  float diff2 = abs(dot(n, uLightDir2));
  float light = 0.18 + 0.52 * diff1 + 0.30 * diff2;

  // Determine which tile we're in (32x32 tiles across [-1,1])
  vec2 tileCoord = floor((vUV + 0.5) * 32.0);

  // Random hue per tile
  float hue = hash1(tileCoord);

  // "White" tiles (vCheck=1) are more saturated and lighter
  // "Dark" tiles (vCheck=0) are less saturated and darker
  float sat = mix(0.25, 0.65, vCheck);
  float lum = mix(0.28, 0.72, vCheck);

  vec3 base = hsl2rgb(hue, sat, lum);
  gl_FragColor = vec4(base * light, 1.0);
}`;

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function linkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  return p;
}

// --- Pawn shader ---
const pawnVS = `
attribute vec3 aPos;
attribute vec3 aNorm;
uniform mat4 uMVP;
varying vec3 vNormal;
varying vec3 vPos;
void main() {
  gl_Position = uMVP * vec4(aPos, 1.0);
  vNormal = aNorm;
  vPos = aPos;
}`;

const pawnFS = `
precision mediump float;
varying vec3 vNormal;
varying vec3 vPos;
uniform vec3 uLightDir;
uniform vec3 uLightDir2;
uniform vec3 uWoodLight;
uniform vec3 uWoodDark;

vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0));
  float b = dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
  float c = dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
  float d = dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  vec2 shift = vec2(100.0);
  mat2 rot = mat2(0.866, 0.5, -0.5, 0.866);
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = rot * p * 2.0 + shift;
    a *= 0.5;
  }
  return v;
}

void main() {
  vec3 n = normalize(vNormal);
  float diff1 = abs(dot(n, uLightDir));
  float diff2 = abs(dot(n, uLightDir2));
  float light = 0.18 + 0.52 * diff1 + 0.30 * diff2;

  vec2 uv = vPos.xy * 10.0 + vPos.z * 7.0;
  float t1 = fbm(uv * 2.0);
  vec2 warped = uv + vec2(t1 * 3.0, fbm(uv * 2.0 + vec2(5.2, 1.3)) * 3.0);
  float t2 = fbm(warped * 2.0);
  vec2 warped2 = warped + vec2(fbm(warped * 1.8 + vec2(1.7, 9.2)) * 2.5, t2 * 2.5);
  float t3 = fbm(warped2 * 2.5);
  float grain = sin(length(warped2) * 3.0 + t3 * 8.0) * 0.5 + 0.5;
  grain = grain * grain;

  vec3 base = mix(uWoodLight, uWoodDark, grain * 0.7);
  gl_FragColor = vec4(base * light, 1.0);
}`;

const boardProg = linkProg(boardVS, boardFS);
const pawnProg = linkProg(pawnVS, pawnFS);

// Board uniforms/attribs
const b_aGrid = gl.getAttribLocation(boardProg, 'aGrid');
const b_aCheck = gl.getAttribLocation(boardProg, 'aCheck');
const b_uMVP = gl.getUniformLocation(boardProg, 'uMVP');
const b_uAng = gl.getUniformLocation(boardProg, 'uAng');
const b_uInnerR = gl.getUniformLocation(boardProg, 'uInnerR');
const b_uOuterR = gl.getUniformLocation(boardProg, 'uOuterR');

// --- Build board mesh (static) ---
const gridBuf = gl.createBuffer();
const checkBuf = gl.createBuffer();
const gridN = 128;
const innerRadius = 0.30;
const outerRadius = 0.85;
const numTris = gridN * gridN * 2;
const totalVerts = numTris * 3;

const gridData = new Float32Array(totalVerts * 2);
const checkData = new Float32Array(totalVerts);
let gi = 0, ci = 0;
for (let j = 0; j < gridN; j++) {
  for (let i = 0; i < gridN; i++) {
    const x0 = (i / gridN) * 2 - 1, x1 = ((i+1) / gridN) * 2 - 1;
    const y0 = (j / gridN) * 2 - 1, y1 = ((j+1) / gridN) * 2 - 1;
    const check = (Math.floor(i / 4) + Math.floor(j / 4)) % 2 === 0 ? 0.0 : 1.0;
    gridData[gi++]=x0; gridData[gi++]=y0;
    gridData[gi++]=x1; gridData[gi++]=y0;
    gridData[gi++]=x0; gridData[gi++]=y1;
    gridData[gi++]=x1; gridData[gi++]=y0;
    gridData[gi++]=x1; gridData[gi++]=y1;
    gridData[gi++]=x0; gridData[gi++]=y1;
    for (let k = 0; k < 6; k++) checkData[ci++] = check;
  }
}
gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf);
gl.bufferData(gl.ARRAY_BUFFER, gridData, gl.STATIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER, checkBuf);
gl.bufferData(gl.ARRAY_BUFFER, checkData, gl.STATIC_DRAW);

// --- Belt shader (ribbons showing twist) ---
const beltVS = `
attribute vec2 aGrid;
attribute float aBeltID;
uniform mat4 uMVP;
uniform float uAng;
uniform float uInnerR;
uniform float uOuterR;
varying vec3 vNormal;
varying float vBeltID;
varying vec2 vBeltUV;

vec3 deform(vec2 p) {
  float dist = length(p);
  if (dist >= uOuterR) return vec3(p, 0.0);
  float falloff;
  if (dist <= uInnerR) {
    falloff = 1.0;
  } else {
    falloff = 1.0 - (dist - uInnerR) / (uOuterR - uInnerR);
    falloff = falloff * falloff * (3.0 - 2.0 * falloff);
  }
  float ang = uAng;
  float tilt = 3.14159265 * falloff;
  float ct, st;
  vec3 q = vec3(p, 0.0);
  ct = cos(-tilt); st = sin(-tilt);
  q = vec3(q.x, q.y*ct - q.z*st, q.y*st + q.z*ct);
  ct = cos(-ang); st = sin(-ang);
  q = vec3(q.x*ct - q.y*st, q.x*st + q.y*ct, q.z);
  ct = cos(tilt); st = sin(tilt);
  q = vec3(q.x, q.y*ct - q.z*st, q.y*st + q.z*ct);
  ct = cos(ang); st = sin(ang);
  q = vec3(q.x*ct - q.y*st, q.x*st + q.y*ct, q.z);
  return q;
}

void main() {
  vec3 pos = deform(aGrid);
  pos.z += 0.008;
  gl_Position = uMVP * vec4(pos, 1.0);
  float eps = 0.002;
  vec3 dx = deform(aGrid + vec2(eps, 0.0)) - deform(aGrid - vec2(eps, 0.0));
  vec3 dy = deform(aGrid + vec2(0.0, eps)) - deform(aGrid - vec2(0.0, eps));
  vNormal = normalize(cross(dx, dy));
  vBeltID = aBeltID;
  vBeltUV = aGrid;
}`;

const beltFS = `
precision mediump float;
varying vec3 vNormal;
varying float vBeltID;
varying vec2 vBeltUV;
uniform vec3 uLightDir;
uniform vec3 uLightDir2;

void main() {
  vec3 n = normalize(vNormal);
  float diff1 = abs(dot(n, uLightDir));
  float diff2 = abs(dot(n, uLightDir2));
  float light = 0.22 + 0.52 * diff1 + 0.30 * diff2;

  // Two distinct belt colors
  vec3 color;
  if (vBeltID < 0.5) {
    color = vec3(0.85, 0.25, 0.18); // red belt
  } else {
    color = vec3(0.18, 0.45, 0.85); // blue belt
  }

  // Subtle stripe pattern along the belt length
  float stripe = smoothstep(0.45, 0.5, abs(fract(vBeltUV.y * 8.0) - 0.5));
  color = mix(color, color * 0.7, stripe * 0.3);

  gl_FragColor = vec4(color * light, 1.0);
}`;

const beltProg = linkProg(beltVS, beltFS);
const belt_aGrid = gl.getAttribLocation(beltProg, 'aGrid');
const belt_aBeltID = gl.getAttribLocation(beltProg, 'aBeltID');
const belt_uMVP = gl.getUniformLocation(beltProg, 'uMVP');
const belt_uAng = gl.getUniformLocation(beltProg, 'uAng');
const belt_uInnerR = gl.getUniformLocation(beltProg, 'uInnerR');
const belt_uOuterR = gl.getUniformLocation(beltProg, 'uOuterR');

// Build belt geometry: two ribbons along the central two chess columns (d and e)
// Chess board is 8x8 mapped to [-1,1], so each column is 0.25 wide
// Column d (index 3): x from -0.25 to 0.0, column e (index 4): x from 0.0 to 0.25
// We make narrow belts within those columns
const beltSegsY = 200; // segments along y for smooth deformation
const beltWidth = 0.06; // width of each belt ribbon
// Belt 0 (left/red): centered at x = -0.125 (middle of column d)
// Belt 1 (right/blue): centered at x = 0.125 (middle of column e)
const beltCenters = [-0.125, 0.125];
const beltGridArr = [];
const beltIDArr = [];

for (let b = 0; b < 2; b++) {
  const cx = beltCenters[b];
  const x0 = cx - beltWidth / 2;
  const x1 = cx + beltWidth / 2;
  for (let j = 0; j < beltSegsY; j++) {
    const y0 = (j / beltSegsY) * 2 - 1;
    const y1 = ((j + 1) / beltSegsY) * 2 - 1;
    // Two triangles per quad
    beltGridArr.push(x0, y0, x1, y0, x0, y1);
    beltGridArr.push(x1, y0, x1, y1, x0, y1);
    for (let k = 0; k < 6; k++) beltIDArr.push(b);
  }
}

const beltGridData = new Float32Array(beltGridArr);
const beltIDData = new Float32Array(beltIDArr);
const beltTotalVerts = beltIDArr.length;

const beltGridBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, beltGridBuf);
gl.bufferData(gl.ARRAY_BUFFER, beltGridData, gl.STATIC_DRAW);

const beltIDBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, beltIDBuf);
gl.bufferData(gl.ARRAY_BUFFER, beltIDData, gl.STATIC_DRAW);

// Pawn uniforms/attribs
const p_aPos = gl.getAttribLocation(pawnProg, 'aPos');
const p_aNorm = gl.getAttribLocation(pawnProg, 'aNorm');
const p_uMVP = gl.getUniformLocation(pawnProg, 'uMVP');
const p_uWoodLight = gl.getUniformLocation(pawnProg, 'uWoodLight');
const p_uWoodDark = gl.getUniformLocation(pawnProg, 'uWoodDark');

// --- Generate procedural pawn mesh (lathe with smooth normals) ---
function generatePawn(scale) {
  // Pawn profile: (radius, height) - taller, gradual base, spherical head
  const profile = [
    // Base platform with notch
    [0.00, 0.00], [0.42, 0.00], [0.42, 0.04], [0.44, 0.05],   // base bottom + lip
    [0.44, 0.08], [0.42, 0.09], [0.42, 0.12],                   // base cylinder + notch in
    [0.44, 0.13], [0.44, 0.15], [0.40, 0.16],                   // notch out + top of base
    // Gradual skirt taper
    [0.36, 0.20], [0.30, 0.28], [0.24, 0.36], [0.19, 0.44],
    [0.15, 0.54], [0.12, 0.64], [0.11, 0.72],                   // stem
    [0.13, 0.78], [0.15, 0.80], [0.15, 0.83], [0.13, 0.85],     // collar
    [0.10, 0.90], [0.09, 0.94],                                   // neck
    // Head - spherical top
    [0.14, 0.99], [0.19, 1.05], [0.22, 1.12], [0.23, 1.20],     // head sides
    [0.22, 1.28], [0.19, 1.34], [0.14, 1.39],                    // head rounding
    [0.08, 1.42], [0.00, 1.44]                                    // smooth dome top
  ];

  const slices = 48;
  const rows = profile.length;

  // Compute averaged normals per vertex (smooth shading)
  // For each profile point, average the normals of adjacent segments
  const profileNormals = [];
  for (let i = 0; i < rows; i++) {
    let nx = 0, nz = 0;
    if (i > 0) {
      const dr = profile[i][0] - profile[i-1][0];
      const dh = profile[i][1] - profile[i-1][1];
      const l = Math.sqrt(dr*dr + dh*dh);
      if (l > 0) { nx += dh/l; nz += -dr/l; }
    }
    if (i < rows - 1) {
      const dr = profile[i+1][0] - profile[i][0];
      const dh = profile[i+1][1] - profile[i][1];
      const l = Math.sqrt(dr*dr + dh*dh);
      if (l > 0) { nx += dh/l; nz += -dr/l; }
    }
    const l = Math.sqrt(nx*nx + nz*nz) || 1;
    profileNormals.push([nx/l, nz/l]);
  }

  const positions = [];
  const normals = [];

  for (let i = 0; i < rows - 1; i++) {
    const [r0, h0] = profile[i];
    const [r1, h1] = profile[i + 1];
    const [nx0, nz0] = profileNormals[i];
    const [nx1, nz1] = profileNormals[i + 1];
    for (let j = 0; j < slices; j++) {
      const a0 = (j / slices) * Math.PI * 2;
      const a1 = ((j + 1) / slices) * Math.PI * 2;
      const c0 = Math.cos(a0), s0 = Math.sin(a0);
      const c1 = Math.cos(a1), s1 = Math.sin(a1);

      const p00 = [r0*c0, r0*s0, h0];
      const p10 = [r1*c0, r1*s0, h1];
      const p01 = [r0*c1, r0*s1, h0];
      const p11 = [r1*c1, r1*s1, h1];

      const n00 = [nx0*c0, nx0*s0, nz0];
      const n10 = [nx1*c0, nx1*s0, nz1];
      const n01 = [nx0*c1, nx0*s1, nz0];
      const n11 = [nx1*c1, nx1*s1, nz1];

      positions.push(...p00, ...p10, ...p01);
      positions.push(...p10, ...p11, ...p01);
      normals.push(...n00, ...n10, ...n01);
      normals.push(...n10, ...n11, ...n01);
    }
  }

  const pos = new Float32Array(positions.length);
  const norm = new Float32Array(normals.length);
  for (let i = 0; i < positions.length; i += 3) {
    pos[i] = positions[i] * scale;
    pos[i+1] = positions[i+1] * scale;
    pos[i+2] = positions[i+2] * scale;
    norm[i] = normals[i];
    norm[i+1] = normals[i+1];
    norm[i+2] = normals[i+2];
  }
  return { pos, norm, count: pos.length / 3 };
}

const pawn = generatePawn(0.16);
const pawnPosBuf = gl.createBuffer();
const pawnNormBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, pawnPosBuf);
gl.bufferData(gl.ARRAY_BUFFER, pawn.pos, gl.STATIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER, pawnNormBuf);
gl.bufferData(gl.ARRAY_BUFFER, pawn.norm, gl.STATIC_DRAW);

// --- Matrix helpers ---
function mat4Ident() { const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function mat4Mul(a, b) {
  const r = new Float32Array(16);
  for (let i=0;i<4;i++) for (let j=0;j<4;j++) {
    r[j*4+i] = a[i]*b[j*4] + a[4+i]*b[j*4+1] + a[8+i]*b[j*4+2] + a[12+i]*b[j*4+3];
  }
  return r;
}
function mat4Persp(fov, asp, near, far) {
  const f = 1/Math.tan(fov/2), nf=1/(near-far);
  const m = new Float32Array(16);
  m[0]=f/asp; m[5]=f; m[10]=(far+near)*nf; m[11]=-1; m[14]=2*far*near*nf;
  return m;
}
function mat4LookAt(eye, center, up) {
  const zx=eye[0]-center[0], zy=eye[1]-center[1], zz=eye[2]-center[2];
  let l=Math.sqrt(zx*zx+zy*zy+zz*zz);
  const fz=[zx/l,zy/l,zz/l];
  const sx=up[1]*fz[2]-up[2]*fz[1], sy=up[2]*fz[0]-up[0]*fz[2], sz=up[0]*fz[1]-up[1]*fz[0];
  l=Math.sqrt(sx*sx+sy*sy+sz*sz);
  const fx=[sx/l,sy/l,sz/l];
  const fy=[fz[1]*fx[2]-fz[2]*fx[1], fz[2]*fx[0]-fz[0]*fx[2], fz[0]*fx[1]-fz[1]*fx[0]];
  const m=mat4Ident();
  m[0]=fx[0];m[4]=fx[1];m[8]=fx[2];m[12]=-(fx[0]*eye[0]+fx[1]*eye[1]+fx[2]*eye[2]);
  m[1]=fy[0];m[5]=fy[1];m[9]=fy[2];m[13]=-(fy[0]*eye[0]+fy[1]*eye[1]+fy[2]*eye[2]);
  m[2]=fz[0];m[6]=fz[1];m[10]=fz[2];m[14]=-(fz[0]*eye[0]+fz[1]*eye[1]+fz[2]*eye[2]);
  return m;
}
function mat4RotZ(a) {
  const m = mat4Ident();
  const c = Math.cos(a), s = Math.sin(a);
  m[0]=c; m[4]=-s; m[1]=s; m[5]=c;
  return m;
}
function mat4Translate(x, y, z) {
  const m = mat4Ident();
  m[12]=x; m[13]=y; m[14]=z;
  return m;
}

const tau = 2 * Math.PI;
let angleDeg = 0;
let zoom = 0, rotation = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function setLights(prog) {
  let ld = [0.4, 0.7, 0.5];
  let ll = Math.sqrt(ld[0]*ld[0]+ld[1]*ld[1]+ld[2]*ld[2]);
  gl.uniform3f(gl.getUniformLocation(prog, 'uLightDir'), ld[0]/ll, ld[1]/ll, ld[2]/ll);
  ld = [-0.6, 0.3, -0.4];
  ll = Math.sqrt(ld[0]*ld[0]+ld[1]*ld[1]+ld[2]*ld[2]);
  gl.uniform3f(gl.getUniformLocation(prog, 'uLightDir2'), ld[0]/ll, ld[1]/ll, ld[2]/ll);
}

function render() {
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  const alpha = angleDeg * Math.PI / 180;

  const aspect = canvas.width / canvas.height;
  const proj = mat4Persp(Math.PI / 4, aspect, 0.1, 100);

  const t = Math.max(-1, Math.min(1, zoom));
  const farEye = [0, 5.0, 3.1];
  const farTarget = [0, 0, 0];
  const topEye = [0, 2.25, 1.4];
  const topTarget = [0, 0, 0];
  const groundEye = [0, 0.1, 0.12];
  const groundTarget = [0, -0.5, 0.0];
  let eye, tgt;
  if (t < 0) {
    const s = -t;
    eye = [
      topEye[0] + s * (farEye[0] - topEye[0]),
      topEye[1] + s * (farEye[1] - topEye[1]),
      topEye[2] + s * (farEye[2] - topEye[2])
    ];
    tgt = [
      topTarget[0] + s * (farTarget[0] - topTarget[0]),
      topTarget[1] + s * (farTarget[1] - topTarget[1]),
      topTarget[2] + s * (farTarget[2] - topTarget[2])
    ];
  } else {
    eye = [
      topEye[0] + t * (groundEye[0] - topEye[0]),
      topEye[1] + t * (groundEye[1] - topEye[1]),
      topEye[2] + t * (groundEye[2] - topEye[2])
    ];
    tgt = [
      topTarget[0] + t * (groundTarget[0] - topTarget[0]),
      topTarget[1] + t * (groundTarget[1] - topTarget[1]),
      topTarget[2] + t * (groundTarget[2] - topTarget[2])
    ];
  }
  const cr = Math.cos(rotation), sr = Math.sin(rotation);
  const rEye = [eye[0]*cr - eye[1]*sr, eye[0]*sr + eye[1]*cr, eye[2]];
  const rTgt = [tgt[0]*cr - tgt[1]*sr, tgt[0]*sr + tgt[1]*cr, tgt[2]];
  const up = [-sr * 0.001, cr * 0.001, 1];
  const ul = Math.sqrt(up[0]*up[0]+up[1]*up[1]+up[2]*up[2]);
  const view = mat4LookAt(rEye, rTgt, [up[0]/ul, up[1]/ul, up[2]/ul]);
  const vp = mat4Mul(proj, view);

  // --- Draw board ---
  gl.useProgram(boardProg);
  gl.uniform1f(b_uAng, -alpha / 2);
  gl.uniform1f(b_uInnerR, innerRadius);
  gl.uniform1f(b_uOuterR, outerRadius);
  gl.uniformMatrix4fv(b_uMVP, false, vp);
  setLights(boardProg);

  // (board drawing disabled)

  // --- Draw belts ---

  gl.useProgram(beltProg);
  gl.uniform1f(belt_uAng, -alpha / 2);
  gl.uniform1f(belt_uInnerR, innerRadius);
  gl.uniform1f(belt_uOuterR, outerRadius);
  gl.uniformMatrix4fv(belt_uMVP, false, vp);
  setLights(beltProg);

  gl.enableVertexAttribArray(belt_aGrid);
  gl.enableVertexAttribArray(belt_aBeltID);
  gl.bindBuffer(gl.ARRAY_BUFFER, beltGridBuf);
  gl.vertexAttribPointer(belt_aGrid, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, beltIDBuf);
  gl.vertexAttribPointer(belt_aBeltID, 1, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, beltTotalVerts);

  gl.disableVertexAttribArray(belt_aGrid);
  gl.disableVertexAttribArray(belt_aBeltID);

  // --- Draw pawns ---

  gl.useProgram(pawnProg);
  setLights(pawnProg);

  gl.enableVertexAttribArray(p_aPos);
  gl.enableVertexAttribArray(p_aNorm);
  gl.bindBuffer(gl.ARRAY_BUFFER, pawnPosBuf);
  gl.vertexAttribPointer(p_aPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, pawnNormBuf);
  gl.vertexAttribPointer(p_aNorm, 3, gl.FLOAT, false, 0, 0);

  // Both pawns orbit with the inner disk rotation
  const rot = mat4RotZ(-alpha);

  // Light pawn (right of center)
  const lightModel = mat4Mul(rot, mat4Translate(0.12, 0, 0));
  gl.uniformMatrix4fv(p_uMVP, false, mat4Mul(vp, lightModel));
  gl.uniform3f(p_uWoodLight, 0.75, 0.58, 0.38);
  gl.uniform3f(p_uWoodDark, 0.55, 0.38, 0.22);
  gl.drawArrays(gl.TRIANGLES, 0, pawn.count);

  // Dark pawn (left of center)
  const darkModel = mat4Mul(rot, mat4Translate(-0.12, 0, 0));
  gl.uniformMatrix4fv(p_uMVP, false, mat4Mul(vp, darkModel));
  gl.uniform3f(p_uWoodLight, 0.38, 0.22, 0.12);
  gl.uniform3f(p_uWoodDark, 0.22, 0.12, 0.06);
  gl.drawArrays(gl.TRIANGLES, 0, pawn.count);
}

const LOOP_DURATION = 8000;
let paused = false, pauseTime = 0, timeOffset = 0;

function easeAngle(t) {
  const smoothT = t - Math.sin(tau * t) / tau;
  return smoothT * 720;
}

function frame(t) {
  if (!paused) {
    const progress = ((t - timeOffset) / LOOP_DURATION) % 1;
    angleDeg = easeAngle(progress);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- Drag interaction ---
let dragging = false, lastX, lastY, dragMoved = false;

function togglePause(now) {
  if (paused) {
    timeOffset += now - pauseTime;
    paused = false;
  } else {
    pauseTime = now;
    paused = true;
  }
}

let touchStartX, touchStartY, touchStartTime;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    dragging = true; dragMoved = false;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
    touchStartX = lastX; touchStartY = lastY;
    touchStartTime = performance.now();
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (dragging && e.touches.length === 1) {
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    const totalDx = e.touches[0].clientX - touchStartX, totalDy = e.touches[0].clientY - touchStartY;
    if (Math.abs(totalDx) > 10 || Math.abs(totalDy) > 10) dragMoved = true;
    rotation -= dx * 0.008;
    zoom = Math.max(-1, Math.min(1, zoom + dy * 0.003));
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!dragMoved && (performance.now() - touchStartTime) < 500) {
    togglePause(performance.now());
  }
  dragging = false;
}, { passive: false });

canvas.addEventListener('mousedown', e => { dragging = true; dragMoved = false; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', e => {
  if (!dragMoved) togglePause(performance.now());
  dragging = false;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
  rotation -= dx * 0.008;
  zoom = Math.max(-1, Math.min(1, zoom + dy * 0.003));
  lastX = e.clientX; lastY = e.clientY;
});
</script>
