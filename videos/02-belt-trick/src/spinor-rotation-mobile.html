<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Spinor Rotation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
canvas { display: block; }
#status { position: fixed; top: 10px; left: 10px; color: #0f0; font: 16px monospace; z-index: 10; pointer-events: none; }
</style>
</head>
<body>
<div id="status"></div>
<canvas id="c"></canvas>
<script src="knight-data.js"></script>
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false, preserveDrawingBuffer: true });
if (!gl) { document.body.innerHTML = '<h1 style="color:white;padding:40px">WebGL not supported</h1>'; }

// --- Board shader (deformation in vertex shader) ---
const boardVS = `
attribute vec2 aGrid;
attribute float aCheck;
uniform mat4 uMVP;
uniform float uAng;
uniform float uInnerR;
uniform float uOuterR;
varying vec3 vNormal;
varying float vCheck;
varying vec2 vUV;

vec3 deform(vec2 p) {
  float dist = length(p);
  if (dist >= uOuterR) return vec3(p, 0.0);
  float falloff;
  if (dist <= uInnerR) {
    falloff = 1.0;
  } else {
    falloff = 1.0 - (dist - uInnerR) / (uOuterR - uInnerR);
    falloff = falloff * falloff * (3.0 - 2.0 * falloff);
  }
  float ang = uAng;
  float tilt = 3.14159265 * falloff;
  float ct, st;
  vec3 q = vec3(p, 0.0);
  ct = cos(-tilt); st = sin(-tilt);
  q = vec3(q.x, q.y*ct - q.z*st, q.y*st + q.z*ct);
  ct = cos(-ang); st = sin(-ang);
  q = vec3(q.x*ct - q.y*st, q.x*st + q.y*ct, q.z);
  ct = cos(tilt); st = sin(tilt);
  q = vec3(q.x, q.y*ct - q.z*st, q.y*st + q.z*ct);
  ct = cos(ang); st = sin(ang);
  q = vec3(q.x*ct - q.y*st, q.x*st + q.y*ct, q.z);
  return q;
}

void main() {
  vec3 pos = deform(aGrid);
  gl_Position = uMVP * vec4(pos, 1.0);
  float eps = 0.002;
  vec3 dx = deform(aGrid + vec2(eps, 0.0)) - deform(aGrid - vec2(eps, 0.0));
  vec3 dy = deform(aGrid + vec2(0.0, eps)) - deform(aGrid - vec2(0.0, eps));
  vNormal = normalize(cross(dx, dy));
  vCheck = aCheck;
  vUV = aGrid * 0.5;
}`;

const boardFS = `
precision mediump float;
varying vec3 vNormal;
varying float vCheck;
varying vec2 vUV;
uniform vec3 uLightDir;
uniform vec3 uLightDir2;

// Simple hash-based noise functions
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0));
  float b = dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
  float c = dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
  float d = dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  vec2 shift = vec2(100.0);
  mat2 rot = mat2(0.866, 0.5, -0.5, 0.866);
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = rot * p * 2.0 + shift;
    a *= 0.5;
  }
  return v;
}

void main() {
  vec3 n = normalize(vNormal);
  float diff1 = abs(dot(n, uLightDir));
  float diff2 = abs(dot(n, uLightDir2));
  float light = 0.18 + 0.52 * diff1 + 0.30 * diff2;

  // Marble veins using global UV
  vec2 uv = vUV;

  // High-frequency sharp veins (the key marble look)
  float tw = fbm(uv * 3.0);
  vec2 warpedUV = uv + tw * 1.5;

  // Sharp vein function: use pow on abs(sin) to create thin lines
  float vein1 = pow(abs(sin(warpedUV.x * 8.0 + warpedUV.y * 5.0 + fbm(warpedUV * 6.0) * 6.0)), 8.0);
  float vein2 = pow(abs(sin(warpedUV.x * 5.0 - warpedUV.y * 7.0 + fbm(warpedUV * 5.0 + vec2(30.0)) * 5.0)), 10.0);
  float vein3 = pow(abs(sin(warpedUV.x * 12.0 + warpedUV.y * 3.0 + fbm(warpedUV * 8.0 + vec2(60.0)) * 4.0)), 12.0);
  float veins = max(vein1, max(vein2, vein3 * 0.7));

  // Soft low-frequency color variation (very subtle)
  float soft = fbm(uv * 1.5) * 0.08;

  // Dark squares: mostly dark with light sharp veins
  vec3 darkBase = vec3(0.08, 0.08, 0.09) + soft;
  darkBase = mix(darkBase, vec3(0.30, 0.29, 0.28), veins * 0.6);

  // Light squares: mostly light with dark sharp veins
  vec2 warpedUV2 = uv + fbm(uv * 2.5 + vec2(50.0)) * 1.5;
  float vein4 = pow(abs(sin(warpedUV2.y * 7.0 + warpedUV2.x * 4.0 + fbm(warpedUV2 * 5.5 + vec2(80.0)) * 5.0)), 8.0);
  float vein5 = pow(abs(sin(warpedUV2.x * 6.0 + warpedUV2.y * 9.0 + fbm(warpedUV2 * 7.0 + vec2(40.0)) * 4.0)), 10.0);
  float vein6 = pow(abs(sin(warpedUV2.y * 14.0 - warpedUV2.x * 3.0 + fbm(warpedUV2 * 9.0 + vec2(20.0)) * 3.0)), 12.0);
  float veinsL = max(vein4, max(vein5, vein6 * 0.7));
  float softL = fbm(uv * 1.2 + vec2(25.0)) * 0.06;
  vec3 lightBase = vec3(0.91, 0.89, 0.87) - softL;
  lightBase = mix(lightBase, vec3(0.55, 0.53, 0.52), veinsL * 0.5);

  vec3 base = mix(darkBase, lightBase, vCheck);
  gl_FragColor = vec4(base * light, 1.0);
}`;

// --- Queen shader (simple transform) ---
const queenVS = `
attribute vec3 aPos;
attribute vec3 aNorm;
uniform mat4 uMVP;
varying vec3 vNormal;
varying vec3 vPos;
void main() {
  gl_Position = uMVP * vec4(aPos, 1.0);
  vNormal = aNorm;
  vPos = aPos;
}`;

const queenFS = `
precision mediump float;
varying vec3 vNormal;
varying vec3 vPos;
uniform vec3 uLightDir;
uniform vec3 uLightDir2;
uniform vec3 uColor;

vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}

float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = dot(hash2(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0));
  float b = dot(hash2(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
  float c = dot(hash2(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
  float d = dot(hash2(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  vec2 shift = vec2(100.0);
  mat2 rot = mat2(0.866, 0.5, -0.5, 0.866);
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = rot * p * 2.0 + shift;
    a *= 0.5;
  }
  return v;
}

void main() {
  vec3 n = normalize(vNormal);
  float diff1 = abs(dot(n, uLightDir));
  float diff2 = abs(dot(n, uLightDir2));
  float light = 0.18 + 0.52 * diff1 + 0.30 * diff2;

  // Red marble - triple-warped fbm for swirly veins
  vec2 uv = vPos.xy * 10.0 + vPos.z * 7.0;
  float t1 = fbm(uv * 2.0);
  vec2 warped = uv + vec2(t1 * 3.0, fbm(uv * 2.0 + vec2(5.2, 1.3)) * 3.0);
  float t2 = fbm(warped * 2.0);
  vec2 warped2 = warped + vec2(fbm(warped * 1.8 + vec2(1.7, 9.2)) * 2.5, t2 * 2.5);
  float t3 = fbm(warped2 * 2.5);
  float marble = sin(length(warped2) * 3.0 + t3 * 8.0) * 0.5 + 0.5;
  marble = marble * marble;

  // Wood grain: rosewood / padauk hues
  vec3 woodLight = vec3(0.62, 0.22, 0.12);
  vec3 woodDark = vec3(0.38, 0.12, 0.06);
  vec3 base = mix(woodLight, woodDark, marble * 0.7);
  gl_FragColor = vec4(base * light, 1.0);
}`;

function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
function linkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  return p;
}

const boardProg = linkProg(boardVS, boardFS);
const queenProg = linkProg(queenVS, queenFS);

// Board uniforms/attribs
const b_aGrid = gl.getAttribLocation(boardProg, 'aGrid');
const b_aCheck = gl.getAttribLocation(boardProg, 'aCheck');
const b_uMVP = gl.getUniformLocation(boardProg, 'uMVP');
const b_uAng = gl.getUniformLocation(boardProg, 'uAng');
const b_uInnerR = gl.getUniformLocation(boardProg, 'uInnerR');
const b_uOuterR = gl.getUniformLocation(boardProg, 'uOuterR');
const b_uLightDir = gl.getUniformLocation(boardProg, 'uLightDir');
const b_uLightDir2 = gl.getUniformLocation(boardProg, 'uLightDir2');

// Queen uniforms/attribs
const q_aPos = gl.getAttribLocation(queenProg, 'aPos');
const q_aNorm = gl.getAttribLocation(queenProg, 'aNorm');
const q_uMVP = gl.getUniformLocation(queenProg, 'uMVP');
const q_uLightDir = gl.getUniformLocation(queenProg, 'uLightDir');
const q_uLightDir2 = gl.getUniformLocation(queenProg, 'uLightDir2');
const q_uColor = gl.getUniformLocation(queenProg, 'uColor');

// --- Build board mesh (static) ---
const gridBuf = gl.createBuffer();
const checkBuf = gl.createBuffer();
const gridN = 256;
const innerRadius = 0.30;
const outerRadius = 0.85;
const numTris = gridN * gridN * 2;
const totalVerts = numTris * 3;

const gridData = new Float32Array(totalVerts * 2);
const checkData = new Float32Array(totalVerts);
let gi = 0, ci = 0;
for (let j = 0; j < gridN; j++) {
  for (let i = 0; i < gridN; i++) {
    const x0 = (i / gridN) * 2 - 1, x1 = ((i+1) / gridN) * 2 - 1;
    const y0 = (j / gridN) * 2 - 1, y1 = ((j+1) / gridN) * 2 - 1;
    const check = (Math.floor(i / 32) + Math.floor(j / 32)) % 2 === 0 ? 0.0 : 1.0;
    gridData[gi++]=x0; gridData[gi++]=y0;
    gridData[gi++]=x1; gridData[gi++]=y0;
    gridData[gi++]=x0; gridData[gi++]=y1;
    gridData[gi++]=x1; gridData[gi++]=y0;
    gridData[gi++]=x1; gridData[gi++]=y1;
    gridData[gi++]=x0; gridData[gi++]=y1;
    for (let k = 0; k < 6; k++) checkData[ci++] = check;
  }
}
gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf);
gl.bufferData(gl.ARRAY_BUFFER, gridData, gl.STATIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER, checkBuf);
gl.bufferData(gl.ARRAY_BUFFER, checkData, gl.STATIC_DRAW);

// --- Load knight mesh from knight-data.js (base64-encoded Float32Arrays) ---
function decodeB64F32(str) {
  const bin = atob(str);
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Float32Array(buf.buffer);
}
const piecePositions = decodeB64F32(knightData.pos);
const pieceNormals = decodeB64F32(knightData.norm);
const pieceVertCount = knightData.count;

const queenPosBuf = gl.createBuffer();
const queenNormBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, queenPosBuf);
gl.bufferData(gl.ARRAY_BUFFER, piecePositions, gl.STATIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER, queenNormBuf);
gl.bufferData(gl.ARRAY_BUFFER, pieceNormals, gl.STATIC_DRAW);

// --- Matrix helpers ---
function mat4Ident() { const m=new Float32Array(16); m[0]=m[5]=m[10]=m[15]=1; return m; }
function mat4Mul(a, b) {
  const r = new Float32Array(16);
  for (let i=0;i<4;i++) for (let j=0;j<4;j++) {
    r[j*4+i] = a[i]*b[j*4] + a[4+i]*b[j*4+1] + a[8+i]*b[j*4+2] + a[12+i]*b[j*4+3];
  }
  return r;
}
function mat4Persp(fov, asp, near, far) {
  const f = 1/Math.tan(fov/2), nf=1/(near-far);
  const m = new Float32Array(16);
  m[0]=f/asp; m[5]=f; m[10]=(far+near)*nf; m[11]=-1; m[14]=2*far*near*nf;
  return m;
}
function mat4LookAt(eye, center, up) {
  const zx=eye[0]-center[0], zy=eye[1]-center[1], zz=eye[2]-center[2];
  let l=Math.sqrt(zx*zx+zy*zy+zz*zz);
  const fz=[zx/l,zy/l,zz/l];
  const sx=up[1]*fz[2]-up[2]*fz[1], sy=up[2]*fz[0]-up[0]*fz[2], sz=up[0]*fz[1]-up[1]*fz[0];
  l=Math.sqrt(sx*sx+sy*sy+sz*sz);
  const fx=[sx/l,sy/l,sz/l];
  const fy=[fz[1]*fx[2]-fz[2]*fx[1], fz[2]*fx[0]-fz[0]*fx[2], fz[0]*fx[1]-fz[1]*fx[0]];
  const m=mat4Ident();
  m[0]=fx[0];m[4]=fx[1];m[8]=fx[2];m[12]=-(fx[0]*eye[0]+fx[1]*eye[1]+fx[2]*eye[2]);
  m[1]=fy[0];m[5]=fy[1];m[9]=fy[2];m[13]=-(fy[0]*eye[0]+fy[1]*eye[1]+fy[2]*eye[2]);
  m[2]=fz[0];m[6]=fz[1];m[10]=fz[2];m[14]=-(fz[0]*eye[0]+fz[1]*eye[1]+fz[2]*eye[2]);
  return m;
}
function mat4RotZ(a) {
  const m = mat4Ident();
  const c = Math.cos(a), s = Math.sin(a);
  m[0]=c; m[4]=-s; m[1]=s; m[5]=c;
  return m;
}

const tau = 2 * Math.PI;
let angleDeg = 0;
let zoom = 0, rotation = 0;

const EXPORT_W = 1920, EXPORT_H = 1080;
const ASPECT = EXPORT_W / EXPORT_H;

function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  if (ww / wh > ASPECT) {
    canvas.height = wh;
    canvas.width = Math.round(wh * ASPECT);
  } else {
    canvas.width = ww;
    canvas.height = Math.round(ww / ASPECT);
  }
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

function setLights(prog) {
  let ld = [0.4, 0.7, 0.5];
  let ll = Math.sqrt(ld[0]*ld[0]+ld[1]*ld[1]+ld[2]*ld[2]);
  gl.uniform3f(gl.getUniformLocation(prog, 'uLightDir'), ld[0]/ll, ld[1]/ll, ld[2]/ll);
  ld = [-0.6, 0.3, -0.4];
  ll = Math.sqrt(ld[0]*ld[0]+ld[1]*ld[1]+ld[2]*ld[2]);
  gl.uniform3f(gl.getUniformLocation(prog, 'uLightDir2'), ld[0]/ll, ld[1]/ll, ld[2]/ll);
}

function render() {
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);

  const alpha = angleDeg * Math.PI / 180;

  const aspect = canvas.width / canvas.height;
  const proj = mat4Persp(Math.PI / 4, aspect, 0.1, 100);

  const t = Math.max(0, Math.min(1, zoom));
  const topEye = [0, 2.25, 1.4];
  const topTarget = [0, 0, 0];
  const groundEye = [0, 0.1, 0.12];
  const groundTarget = [0, -0.5, 0.0];
  const eye = [
    topEye[0] + t * (groundEye[0] - topEye[0]),
    topEye[1] + t * (groundEye[1] - topEye[1]),
    topEye[2] + t * (groundEye[2] - topEye[2])
  ];
  const tgt = [
    topTarget[0] + t * (groundTarget[0] - topTarget[0]),
    topTarget[1] + t * (groundTarget[1] - topTarget[1]),
    topTarget[2] + t * (groundTarget[2] - topTarget[2])
  ];
  const cr = Math.cos(rotation), sr = Math.sin(rotation);
  const rEye = [eye[0]*cr - eye[1]*sr, eye[0]*sr + eye[1]*cr, eye[2]];
  const rTgt = [tgt[0]*cr - tgt[1]*sr, tgt[0]*sr + tgt[1]*cr, tgt[2]];
  const up = [-sr * 0.001, cr * 0.001, 1];
  const ul = Math.sqrt(up[0]*up[0]+up[1]*up[1]+up[2]*up[2]);
  const view = mat4LookAt(rEye, rTgt, [up[0]/ul, up[1]/ul, up[2]/ul]);
  const vp = mat4Mul(proj, view);

  // --- Draw board ---
  gl.useProgram(boardProg);
  gl.uniform1f(b_uAng, -alpha / 2);
  gl.uniform1f(b_uInnerR, innerRadius);
  gl.uniform1f(b_uOuterR, outerRadius);
  gl.uniformMatrix4fv(b_uMVP, false, vp);
  setLights(boardProg);

  gl.enableVertexAttribArray(b_aGrid);
  gl.enableVertexAttribArray(b_aCheck);
  gl.disableVertexAttribArray(2); // make sure queen attribs are off

  gl.bindBuffer(gl.ARRAY_BUFFER, gridBuf);
  gl.vertexAttribPointer(b_aGrid, 2, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, checkBuf);
  gl.vertexAttribPointer(b_aCheck, 1, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, totalVerts);

  // --- Draw queen ---
  // Queen sits at center, rotates with the inner disk (pure Z-rotation by alpha)
  const queenModel = mat4RotZ(-alpha);
  const queenMVP = mat4Mul(vp, queenModel);

  gl.useProgram(queenProg);
  gl.uniformMatrix4fv(q_uMVP, false, queenMVP);
  gl.uniform3f(q_uColor, 0.85, 0.12, 0.1);
  setLights(queenProg);

  gl.enableVertexAttribArray(q_aPos);
  gl.enableVertexAttribArray(q_aNorm);

  gl.bindBuffer(gl.ARRAY_BUFFER, queenPosBuf);
  gl.vertexAttribPointer(q_aPos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, queenNormBuf);
  gl.vertexAttribPointer(q_aNorm, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLES, 0, pieceVertCount);
}

const LOOP_DURATION = 8000;
let paused = false, pauseTime = 0, timeOffset = 0;

function easeAngle(t) {
  const smoothT = t - Math.sin(tau * t) / tau;
  return smoothT * 720;
}

function frame(t) {
  if (!paused) {
    const progress = ((t - timeOffset) / LOOP_DURATION) % 1;
    angleDeg = easeAngle(progress);
  }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// --- Drag interaction ---
let dragging = false, lastX, lastY, dragMoved = false;

function togglePause(now) {
  if (paused) {
    timeOffset += now - pauseTime;
    paused = false;
  } else {
    pauseTime = now;
    paused = true;
  }
}

canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true; dragMoved = false;
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (dragging && e.touches.length === 1) {
    const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
    rotation -= dx * 0.008;
    zoom = Math.max(0, Math.min(1, zoom + dy * 0.003));
    lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }
}, { passive: false });
canvas.addEventListener('touchend', e => {
  if (!dragMoved) togglePause(performance.now());
  dragging = false;
});

canvas.addEventListener('mousedown', e => { dragging = true; dragMoved = false; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', e => {
  if (!dragMoved) togglePause(performance.now());
  dragging = false;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
  rotation -= dx * 0.008;
  zoom = Math.max(0, Math.min(1, zoom + dy * 0.003));
  lastX = e.clientX; lastY = e.clientY;
});

// --- Frame export ---
const FPS = 60;
const TOTAL_FRAMES = Math.round(LOOP_DURATION / 1000 * FPS);
let exporting = false, exportFrame = 0;
const statusEl = document.getElementById('status');

async function exportFrames() {
  if (exporting) return;
  exporting = true;
  paused = true;

  // Set canvas to exact export resolution
  const savedW = canvas.width, savedH = canvas.height;
  canvas.width = EXPORT_W;
  canvas.height = EXPORT_H;
  gl.viewport(0, 0, EXPORT_W, EXPORT_H);

  statusEl.textContent = `Exporting ${TOTAL_FRAMES} frames at ${EXPORT_W}x${EXPORT_H}...`;

  for (let f = 0; f < TOTAL_FRAMES; f++) {
    exportFrame = f;
    const progress = f / TOTAL_FRAMES;
    angleDeg = easeAngle(progress);
    render();

    const dataURL = canvas.toDataURL('image/png');
    const resp = await fetch('/frame/' + f, { method: 'POST', body: dataURL });
    if (!resp.ok) {
      statusEl.textContent = `Error at frame ${f}!`;
      break;
    }
    statusEl.textContent = `Exported frame ${f + 1} / ${TOTAL_FRAMES}`;
  }

  // Restore canvas size
  canvas.width = savedW;
  canvas.height = savedH;
  gl.viewport(0, 0, savedW, savedH);

  statusEl.textContent = `Done! ${TOTAL_FRAMES} frames exported. Use: ffmpeg -framerate ${FPS} -i frames/frame%04d.png -c:v libx264 -pix_fmt yuv420p output.mp4`;
  exporting = false;
  paused = false;
  timeOffset = performance.now();
}

window.addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') exportFrames();
});
</script>
</body>
</html>
