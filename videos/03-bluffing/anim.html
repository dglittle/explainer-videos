 txt('(no bluffs: a raise means a 4, so the big blind folds everything)',W/2,1000,30,C.dim,'center','',ev(a,0.4,0.6)*(1-ev(b,0,0.5)));
 txt('(the big blind’s bluff is worth 7/36 of a chip per hand to it)',W/2,1000,30,C.dim,'center','',ev(b,0.7,0.6))}
function scEnd(){
 const a=LK('bluffing isn'), k=ev(a,0,0.8), lift=ev(a,0.55,0.8);
 for(let n=1;n<=4;n++)card(960+(n-2.5)*190,560-(n==1?lift*60:0),300,n,{a:k,rot:(n-2.5)*0.1,glow:n==1&&lift>0?C.gold:null});
 txt('bluffing is math',W/2,190,100,C.txt,'center','bold',k);
 rich([['with a 1: raise ',C.gold],{f:['1','3'],c:C.gold},[' of the time',C.gold]],W/2,880,48,'center',lift);
 txt('Tiny Poker',W/2,1000,34,C.dim,'center','',after(a,0.5,1))}
const SCENES=[['title',0,scTitle],['the table',2,scTable],['game tree',5,scTree],['strategies',9,scStrat],['one pair',12,scPair],['matrix',13,scMatrix],
 ['linear program',17,scLP],['solve',18,scSolve],['strategy',20,scHuman],['why ⅓',23,scWhy],['is it worth it',27,scCompare],['end',29,scEnd]];
function drawFrame(t){tt=t;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;const g=ctx.createRadialGradient(W/2,H*0.45,200,W/2,H/2,1200);g.addColorStop(0,'#15222f');g.addColorStop(1,'#080e15');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(let q=0;q<SCENES.length;q++){const s0=q?S[SCENES[q][1]]-GAP*0.6:0, s1=q<SCENES.length-1?S[SCENES[q+1][1]]-GAP*0.6:T+1;
  if(t<s0-0.35||t>s1+0.35)continue;const a=Math.min(cl((t-s0+0.35)/0.35),cl((s1+0.35-t)/0.35));if(a<=0)continue;
  ctx.save();ctx.globalAlpha=q?a:Math.min(1,cl((s1+0.35-t)/0.35));SCENES[q][2]();ctx.restore()}
 return cv}
// the booth's frames per line: [key, [start, middle, end anim times]]
const VK=SCRIPT.map(([k],i)=>[k,[S[i]+0.15,(S[i]+E[i])/2,E[i]+Math.min(0.3,SCRIPT[i][2])]]);
// ==== ENGINE END ====
const CAP=SCRIPT.map(([k,s],i)=>[S[i]-0.2,E[i]+0.2,s]);

document.getElementById('note').innerHTML=`v0.1 (Oct-21). ${SCRIPT.length} lines, ${T.toFixed(0)} s at the guessed pace. The payoff matrix is computed in this page from the rules. The optimal weights come from the linear program (solve.py, scipy/HiGHS), and the page checks that every big-blind column pays at least 5/36 against them: <b>${(VAL*36).toFixed(6)}/36</b>.`;
let capOn=false;
function caption(t){const c=CAP.find(c=>t>=c[0]&&t<c[1]);return c?c[2]:''}
function render(t){drawFrame(t);const s=caption(t);
 if(capOn&&s){ctx.save();ctx.font='34px sans-serif';ctx.textAlign='center';ctx.fillStyle='#000c';const w=Math.min(1800,ctx.measureText(s).width);ctx.fillRect(W/2-w/2-24,H-84,w+48,62);ctx.fillStyle='#fff';ctx.fillText(s,W/2,H-42,1800);ctx.restore()}
 capEl.textContent=s;timeEl.textContent=t.toFixed(1)+' / '+T.toFixed(1);scrub.value=t;
 let ci=0;SCENES.forEach((c,i)=>{if(t>=S[c[1]]-GAP)ci=i});chapBtns.forEach((b,i)=>b.classList.toggle('on',i===ci))}
const capEl=document.getElementById('cap'),timeEl=document.getElementById('time'),scrub=document.getElementById('scrub'),playB=document.getElementById('play');
scrub.max=T;
const chapBtns=SCENES.map(([n,l])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{t=Math.max(0,S[l]-0.3);render(t)};document.getElementById('chap').appendChild(b);return b});
let t=0,playing=false,last=0;
function frame(now){if(!playing)return;t+=(now-last)/1000;last=now;if(t>=T){t=T;setPlay(false)}render(t);if(playing)requestAnimationFrame(frame)}
function setPlay(p){playing=p;playB.textContent=p?'❚❚ Pause':'▶ Play';if(p){if(t>=T)t=0;last=performance.now();requestAnimationFrame(frame)}}
playB.onclick=()=>setPlay(!playing);
scrub.oninput=()=>{t=+scrub.value;render(t)};
document.getElementById('capon').onchange=e=>{capOn=e.target.checked;render(t)};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlay(!playing)}
 if(e.code==='ArrowRight'){t=Math.min(T,t+2);render(t)}if(e.code==='ArrowLeft'){t=Math.max(0,t-2);render(t)}});
const hm=location.hash.match(/t=([\d.]+)/);if(hm)t=+hm[1];
render(t);
