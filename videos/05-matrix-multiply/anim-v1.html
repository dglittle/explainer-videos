['not claiming',"I don't know where I found this, and I'm not claiming I invented it. It's just an idea I want to tell more people about, because of how awesome it is.",0.8],
['on paper',"This is a nice way for humans to multiply matrices on paper.",1.0],
['we have our first',"We have our first matrix.",1.6],
['draw it above',"And then, rather than drawing our next matrix next to it, we instead draw it above.",1.6],
['implied space',"And then, this implied space is the result.",3.4],
['trace our finger',"And to calculate each cell, we need only trace our finger left to get the stuff we care about in the first matrix, and up to get the stuff we care about in the second matrix.",0.6],
['sum them',"And then just do the regular: multiply all the elements, and sum them.",5.2],
