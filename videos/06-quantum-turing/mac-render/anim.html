const cx=(re,im=0)=>[re,im], cmul=(a,b)=>[a[0]*b[0]-a[1]*b[1],a[0]*b[1]+a[1]*b[0]], cadd=(a,b)=>[a[0]+b[0],a[1]+b[1]];

 txt('a step of computation,',LP,430,36,C.txt,'left','bold',a);txt('the funny way',LP,480,36,C.gold,'left','bold',a);
 if(NOTE_HEAD){const n=after(LK('tape is finite'),0.2,0.6)*(1-ev(l5,0.3,0.5));
  txt('(the head’s position and the machine’s own',LP,580,24,C.dim,'left','',n);txt('state can be written on the tape too)',LP,612,24,C.dim,'left','',n)}}
function scEnd(){const l14=LK('boils down'), k=ev(l14,0.1,0.7), k2=ev(l14,0.45,0.7), k3=after(l14,0.2,0.7);
 const cxm=(ENDBOX[0]+ENDBOX[2])/2;
 txt('any quantum computation',cxm,330,58,C.txt,'center','bold',k);txt('boils down to this:',cxm,398,58,C.txt,'center','bold',k);
 rich([['vector  ←  vector · ',C.gold,'bold'],['U',C.a,'bold']],cxm,500,52,'center',k2);
 txt('(length 1 in, length 1 out)',cxm,566,30,C.dim,'center','',k2);
 txt('then look: you see state i with probability |aᵢ|²',cxm,640,30,C.dim,'center','',k3);
 if(CREDIT){const c=after(l14,1.2,0.8);
  rich([['related: ',C.dim],['Scott Aaronson',C.txt,'bold'],[', quantum mechanics as probability theory with the 2-norm (and complex numbers),',C.dim]],W/2-80,912,23,'center',c);
  rich([['Quantum Computing Since Democritus',C.txt,''],[', ch. 9  ·  quantum Turing machines: ',C.dim],['Deutsch 1985, Bernstein–Vazirani 1993',C.txt,'']],W/2-80,948,23,'center',c);
  rich([['reversible computation: ',C.dim],['Bennett 1973',C.txt,'']],W/2-80,984,23,'center',c)}}
function drawFrame(t){tt=t;
 g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;const grd=g.createRadialGradient(W/2,H*0.45,200,W/2,H/2,1200);grd.addColorStop(0,'#131f2c');grd.addColorStop(1,'#070c12');g.fillStyle=grd;g.fillRect(0,0,W,H);
 const l1=LK('my understanding'), l2=LK('long tape'), l14=LK('boils down');
 const dive=ev(l2,0,0.9);
 if(dive<1){g.save();const z=1+0.35*dive;g.translate(W/2,H/2);g.scale(z,z);g.translate(-W/2,-H/2);
  swarmDraw(SW1,0.2,1-dive,[W/2-700,30,W/2+700,210],ev(l1,0.05,0.7));g.restore()}
 if(tt>S[l14])swarmDraw(SW2,S[l14]+0.3,0.8,null,0);
 g.save();g.globalAlpha=1-ev(l2,0,0.6);scIntro();g.restore();
 if(tt<S[LK('rather funny way')]){if(dive>0)scTape()}else smallTape();
 scFunny();
 if(t>S[LK('could possibly be in')]-1)scMain();
 scEnd();
 return cv}
// the booth's frames per line: [key, [start, middle, end anim times]]
const VK=SCRIPT.map(([k],i)=>[k,[S[i]+0.15,(S[i]+E[i])/2,E[i]+Math.min(0.3,SCRIPT[i][2])]]);
// ==== ENGINE END ====
const SCENES=[['intro',0],['Turing machine',1],['finite tape',2],['all the states',4],['the 1',5],['the matrix',6],['relax: length 1',7],['complex',8],['keep length 1',9],['unitary (opt.)',10],['looking (opt.)',11],['the TM of QC',12],['the end',13]];
const CAP=SCRIPT.map(([k,s],i)=>[S[i]-0.2,E[i]+0.2,s]);
// checks: every number on screen comes from the code above; these re-derive them a second way
const CHK={
 perm:P.every(r=>r.filter(z=>cabs(z)>0).length==1)&&P[0].map((_,j)=>P.filter(r=>cabs(r[j])>0).length==1).every(x=>x)&&P.every(r=>r.every(z=>z[1]==0&&(z[0]==0||z[0]==1))),
 rowform:close(norm(vm(V0,MP).map((z,i)=>cadd(z,mv(P,V0)[i].map(x=>-x)))),0)&&close(norm(Q1.map((z,i)=>cadd(z,mv(U,VC)[i].map(x=>-x)))),0)&&MP.every(r=>r.filter(z=>cabs(z)>0).length==1),
 counter:[V0,V1,V2].map(v=>BITS(v.findIndex(z=>z[0]==1))).join(' ')=='011 100 101',
 unitary:mmul(dag(U),U).every((r,i)=>r.every((z,j)=>close(z[0],i==j?1:0,1e-12)&&close(z[1],0,1e-12))),
 gates:GATES.every(G=>mmul(dag(G),G).every((r,i)=>r.every((z,j)=>close(z[0],i==j?1:0,1e-12)&&close(z[1],0,1e-12)))),
 norms:[V0,V1,V2,VR,VC,Q1,Q2,VS,Q3,Q4].every(v=>close(norm(v),1,1e-12)),
 exact:VR.map(fmt).join(',')=='0,0,0,0,½,−½,½,−½'&&VC.map(fmt).join(',')=='0,0,0,0,½,−½,½i,−½i',
 conj:VC.every(z=>close(cmul(z,conj(z))[0],abs2(z))&&close(cmul(z,conj(z))[1],0)),
 born:close(PROB.reduce((a,b)=>a+b,0),1,1e-12),
 erase:close(ELEN,Math.SQRT2,1e-12),
 swarm:[...SW1,...SW2].every(e=>e.V.every(v=>close(norm(v),1,1e-9))&&(!e.classical||e.V.every(isHot)))};
const BAD=Object.entries(CHK).filter(([k,v])=>!v).map(([k])=>k);
if(BAD.length)console.error('math check failed: '+BAD.join(', '));
const cfmt=z=>(z[0]>=0?'':'−')+Math.abs(z[0]).toFixed(2)+(z[1]>=0?'+':'−')+Math.abs(z[1]).toFixed(2)+'i';
document.getElementById('note').innerHTML=`draft 1 (Oct-24). ${SCRIPT.length} lines (2 marked OPTIONAL), ${T.toFixed(0)} s at the guessed pace. Every number is computed in the page and re-checked: the classical matrix is a permutation (one 1 in every row and column) <b>${CHK.perm}</b>; the tape counts 011 → 100 → 101 <b>${CHK.counter}</b>; U (a product of ${GATES.length} small gates) is unitary, U†U = I <b>${CHK.unitary&&CHK.gates}</b>; every vector shown has length 1 <b>${CHK.norms}</b>; z·z̄ = |z|² <b>${CHK.conj}</b>; the probabilities |aᵢ|² add up to 1 <b>${CHK.born}</b>; the erasing step gives length √2 <b>${CHK.erase}</b>; the ${SW1.length}+${SW2.length} little machines in the swarm keep length 1 <b>${CHK.swarm}</b>.<br>U·v for the complex vector: ${Q1.map(cfmt).join(', ')}. What we "see" in the looking scene: ${BITS(SEEN)} (a fixed draw u = ${DRAW}, probability ${PROB[SEEN].toFixed(3)}). Optional extras: CREDIT=${CREDIT}, NOTE_HEAD=${NOTE_HEAD}, NOTE_GATES=${NOTE_GATES}.`;
let capOn=false;
function caption(t){const c=CAP.find(c=>t>=c[0]&&t<c[1]);return c?c[2]:''}
function render(t){drawFrame(t);const s=caption(t);
 if(capOn&&s){ctx.save();ctx.font='34px sans-serif';ctx.textAlign='center';ctx.fillStyle='#000c';const w=Math.min(1800,ctx.measureText(s).width);ctx.fillRect(W/2-w/2-24,H-84,w+48,62);ctx.fillStyle='#fff';ctx.fillText(s,W/2,H-42,1800);ctx.restore()}
 capEl.textContent=s;timeEl.textContent=t.toFixed(1)+' / '+T.toFixed(1);scrub.value=t;
 let ci=0;SCENES.forEach((c,i)=>{if(t>=S[c[1]]-GAP)ci=i});chapBtns.forEach((b,i)=>b.classList.toggle('on',i===ci))}
const capEl=document.getElementById('cap'),timeEl=document.getElementById('time'),scrub=document.getElementById('scrub'),playB=document.getElementById('play');
scrub.max=T;
const chapBtns=SCENES.map(([n,l])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{t=Math.max(0,S[l]-0.3);render(t)};document.getElementById('chap').appendChild(b);return b});
let t=0,playing=false,last=0;
function frame(now){if(!playing)return;t+=(now-last)/1000;last=now;if(t>=T){t=T;setPlay(false)}render(t);if(playing)requestAnimationFrame(frame)}
function setPlay(p){playing=p;playB.textContent=p?'❚❚ Pause':'▶ Play';if(p){if(t>=T)t=0;last=performance.now();requestAnimationFrame(frame)}}
playB.onclick=()=>setPlay(!playing);
scrub.oninput=()=>{t=+scrub.value;render(t)};
document.getElementById('capon').onchange=e=>{capOn=e.target.checked;render(t)};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlay(!playing)}
 if(e.code==='ArrowRight'){t=Math.min(T,t+2);render(t)}if(e.code==='ArrowLeft'){t=Math.max(0,t-2);render(t)}});
const hm=location.hash.match(/t=([\d.]+)/);if(hm)t=+hm[1];
render(t);
</script>
