const SCENES=[['intro',0],['the diagram',1],['time',2],['convert',3],['8 states',4],['little matrices',5],['copy it in',6],['mixing pairs',7],['run it',8],['same order (opt.)',9],['all together',10],['the end',11]];
const CAP=SCRIPT.map(([k,s],i)=>[S[i]-0.2,E[i]+0.2,s]);
const meq=(A,B)=>A.every((r,i)=>r.every((x,j)=>close(x,B[i][j])));
const I2=eye(2);
const CHK={
 kron:meq(expand(GATES[0]),kron(HM,kron(I2,I2)))&&meq(expand(GATES[1]),kron(CNM,I2))&&meq(expand(GATES[2]),kron(I2,CNM)),
 symmetric:GATES.every(G=>meq(expand(G),tr(expand(G)))),
 unitary:MATS.every(M=>meq(mmul(M,tr(M)),eye(N))),
 stamps:STAMPS.every(s=>s.cells.every(c=>close(MS[0][c.i][c.j],HM[c.r][c.c])))&&MS[0].every((r,i)=>r.every((x,j)=>close(x,0)||STAMPS.some(s=>s.cells.some(c=>c.i==i&&c.j==j)))),
 ghz:close(V3[0],R2)&&close(V3[7],R2)&&V3.every((x,i)=>i==0||i==7||close(x,0)),
 together:meq([VU],[V3]),
 order:meq(tr(UT),[2,1,0].map(k=>tr(MS[k])).reduce((A,B)=>mmul(A,B))),
 norms:[V0,V1,V2,V3,VU].every(v=>close(norm(v),1)),
 swarm:[...SW1,...SW2].every(e=>meq(mmul(e.M,tr(e.M)),eye(e.n)))};
const BAD=Object.entries(CHK).filter(([k,v])=>!v).map(([k])=>k);
if(BAD.length)console.error('math check failed: '+BAD.join(', '));
document.getElementById('note').innerHTML=`draft 1 (Oct-24). ${SCRIPT.length} lines (DRAFT wording for Greg to rewrite; 'same order' is optional), ${T.toFixed(0)} s at the guessed pace. Every number is computed in the page and re-checked: each big matrix = copying the little one in, the same as the Kronecker (tensor) product <b>${CHK.kron}</b>; the four copies of H land where the picture says <b>${CHK.stamps}</b>; these gates are symmetric (so row and column vectors use the same matrix) <b>${CHK.symmetric}</b>; every big matrix is unitary <b>${CHK.unitary}</b>; 000 → (000 + 111)/√2 <b>${CHK.ghz}</b>; one big matrix gives the same result <b>${CHK.together}</b>; with column vectors the order is reversed <b>${CHK.order}</b>; lengths stay 1 <b>${CHK.norms}</b>; the ${SW1.length}+${SW2.length} little circuits' matrices are unitary <b>${CHK.swarm}</b>. Optional extras: NOTE_TENSOR=${NOTE_TENSOR}, NOTE_LOOK=${NOTE_LOOK}, NOTE_NEXT=${NOTE_NEXT}.`;
let capOn=false;
function caption(t){const c=CAP.find(c=>t>=c[0]&&t<c[1]);return c?c[2]:''}
function render(t){drawFrame(t);const s=caption(t);
 if(capOn&&s){ctx.save();ctx.font='34px sans-serif';ctx.textAlign='center';ctx.fillStyle='#000c';const w=Math.min(1800,ctx.measureText(s).width);ctx.fillRect(W/2-w/2-24,H-84,w+48,62);ctx.fillStyle='#fff';ctx.fillText(s,W/2,H-42,1800);ctx.restore()}
 capEl.textContent=s;timeEl.textContent=t.toFixed(1)+' / '+T.toFixed(1);scrub.value=t;
 let ci=0;SCENES.forEach((c,i)=>{if(t>=S[c[1]]-GAP)ci=i});chapBtns.forEach((b,i)=>b.classList.toggle('on',i===ci))}
const capEl=document.getElementById('cap'),timeEl=document.getElementById('time'),scrub=document.getElementById('scrub'),playB=document.getElementById('play');
scrub.max=T;
const chapBtns=SCENES.map(([n,l])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{t=Math.max(0,S[l]-0.3);render(t)};document.getElementById('chap').appendChild(b);return b});
let t=0,playing=false,last=0;
function frame(now){if(!playing)return;t+=(now-last)/1000;last=now;if(t>=T){t=T;setPlay(false)}render(t);if(playing)requestAnimationFrame(frame)}
function setPlay(p){playing=p;playB.textContent=p?'❚❚ Pause':'▶ Play';if(p){if(t>=T)t=0;last=performance.now();requestAnimationFrame(frame)}}
playB.onclick=()=>setPlay(!playing);
scrub.oninput=()=>{t=+scrub.value;render(t)};
document.getElementById('capon').onchange=e=>{capOn=e.target.checked;render(t)};
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlay(!playing)}
 if(e.code==='ArrowRight'){t=Math.min(T,t+2);render(t)}if(e.code==='ArrowLeft'){t=Math.max(0,t-2);render(t)}});
const hm=location.hash.match(/t=([\d.]+)/);if(hm)t=+hm[1];
render(t);
</script>
</body></html>
