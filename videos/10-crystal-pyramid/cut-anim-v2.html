<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>crystal cut: animation scenes</title>
<style>
html,body{margin:0;height:100%;background:#0b0e16;overflow:hidden}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
canvas#cv{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
#gl{display:none}
</style></head><body>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<canvas id="gl" width="1920" height="1080"></canvas>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 RES;
uniform vec3 C[4];      // ball centers (already rotated)
uniform float RAD;      // ball radius
uniform vec3 EYE;
uniform mat3 CAM;
uniform int DEPTH;      // how many balls a ray may pass through before we shade the next one cheaply
const vec3 L = normalize(vec3(-0.5, 1.0, 0.35));   // light direction
const float IOR = 1.5;
const vec3 TINT = vec3(0.90, 0.95, 1.0);           // a hint of blue per pass through the crystal

float hitSphere(vec3 ro, vec3 rd, vec3 c, float r, out float tFar){
  vec3 oc = ro - c; float b = dot(oc, rd); float h = b*b - dot(oc, oc) + r*r;
  tFar = -1.0;
  if (h < 0.0) return -1.0;
  h = sqrt(h); tFar = -b + h;
  float t = -b - h;
  return t > 1e-3 ? t : -1.0;
}
vec3 sky(vec3 rd){
  float y = rd.y;
  vec3 c = mix(vec3(0.05,0.06,0.10), vec3(0.16,0.20,0.32), smoothstep(-0.2, 0.8, y));
  c += vec3(1.0,0.95,0.85) * pow(max(dot(rd, L), 0.0), 60.0) * 2.0;           // the lamp
  c += vec3(0.5,0.7,1.0) * smoothstep(0.92, 1.0, dot(rd, normalize(vec3(0.8,0.3,-0.6)))) * 0.6;  // a soft window
  return c;
}
// the floor: dark, faint grid, glassy shadows with a caustic spot (faked, not traced)
vec3 floorCol(vec3 p, vec3 rd, float t){
  vec2 g = abs(fract(p.xz * 1.0) - 0.5);
  float line = 1.0 - smoothstep(0.0, 0.02 + t*0.002, min(g.x, g.y));
  vec3 c = vec3(0.07,0.08,0.12) + vec3(0.10,0.14,0.22) * line;
  float lightAmt = 1.0, caus = 0.0;
  for (int i = 0; i < 4; i++){
    vec3 oc = p - C[i]; float b = dot(oc, L); float d2 = dot(oc, oc) - b*b;
    if (b < 0.0){
      float q = d2 / (RAD*RAD);
      lightAmt *= mix(0.45, 1.0, smoothstep(0.85, 1.05, q));
      caus += exp(-q * 30.0) * 1.6;
    }
  }
  c *= 0.55 + 0.6 * lightAmt;
  c += vec3(1.0,0.85,0.6) * caus * 0.35;
  return mix(c, sky(rd), smoothstep(8.0, 22.0, t));   // fade into the distance
}
float fresnel(vec3 rd, vec3 n){ return 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0); }
// nearest ball (index, or -1) along a ray
int nearest(vec3 ro, vec3 rd, out float best){
  best = 1e9; int hit = -1; float tf;
  for (int i = 0; i < 4; i++){
    float t = hitSphere(ro, rd, C[i], RAD, tf);
    if (t > 0.0 && t < best){ best = t; hit = i; }
  }
  return hit;
}
vec3 center(int k){ vec3 c = C[0]; for (int i = 0; i < 4; i++) if (i == k) c = C[i]; return c; }
// what a ray sees if we stop tracing here: a ball is shaded in one step (sky through it + sky reflected)
vec3 cheap(vec3 ro, vec3 rd){
  float t; int k = nearest(ro, rd, t);
  float tFloor = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
  if (k >= 0 && t < tFloor){
    vec3 n = normalize(ro + rd*t - center(k));
    return mix(sky(refract(rd, n, 1.0/IOR)) * vec3(0.75,0.85,1.0), sky(reflect(rd, n)), fresnel(rd, n));
  }
  if (tFloor < 1e8) return floorCol(ro + rd*tFloor, rd, tFloor);
  return sky(rd);
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*RES) / RES.y;
  vec3 ro = EYE, rd = normalize(CAM * vec3(uv, 1.9));
  vec3 col = vec3(0.0), thr = vec3(1.0);
  for (int pass = 0; pass < 6; pass++){
    if (pass >= DEPTH){ col += thr * cheap(ro, rd); break; }
    float t; int k = nearest(ro, rd, t);
    float tFloor = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
    if (k < 0 || tFloor < t){
      col += thr * (tFloor < 1e8 ? floorCol(ro + rd*tFloor, rd, tFloor) : sky(rd));
      break;
    }
    // a ball: the reflected part is shaded cheaply; the refracted part goes in, out, and on to the next ball
    vec3 c = center(k), p = ro + rd*t, n = normalize(p - c);
    float F = fresnel(rd, n);
    col += thr * (F * cheap(p + n*1e-3, reflect(rd, n))
                  + vec3(1.0) * pow(max(dot(reflect(rd, n), L), 0.0), 400.0) * 3.0          // highlight
                  + vec3(0.4,0.6,1.0) * pow(1.0 - max(dot(-rd, n), 0.0), 3.0) * 0.25);     // rim
    thr *= (1.0 - F) * TINT;
    vec3 r = refract(rd, n, 1.0/IOR), q = p;
    for (int b = 0; b < 4; b++){                  // bounce around inside until the ray gets out
      float tf; hitSphere(q - r*1e-3, r, c, RAD, tf);
      q = q - r*1e-3 + r*tf;
      vec3 n2 = normalize(q - c);
      vec3 out_ = refract(r, -n2, IOR);
      if (dot(out_, out_) > 0.5){ r = out_; break; }
      r = reflect(r, -n2);                        // total internal reflection
    }
    ro = q + r*2e-3; rd = r;
  }
  col = col / (1.0 + col * 0.25);                        // soft tone map
  col = pow(col, vec3(0.4545));
  float v = 1.0 - 0.35 * dot(uv*0.9, uv*0.9);             // vignette
  gl_FragColor = vec4(col * v, 1.0);
}
</script>
<script>
// Scenes for the first cut (?scene=spin|arrows, ?t= to hold one time). drawFrame(t) draws the 3-D balls (WebGL, offscreen)
// into cv, then the 2-D overlay (arrows) on top. Frames are grabbed from cv.
const P = new URLSearchParams(location.search);
const SCENE = P.get('scene') || 'spin';
const DEPTH = +(P.get('depth') || 3);
const SCENES = {spin: 4, arrows: 5};          // seconds
const glc = document.getElementById('gl'), cv = document.getElementById('cv'), g = cv.getContext('2d');
const gl = glc.getContext('webgl', {preserveDrawingBuffer: true, antialias: false});
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

const R = 1;
const base = [0,1,2].map(k => [2*R/Math.sqrt(3)*Math.cos(k*2*Math.PI/3), R, 2*R/Math.sqrt(3)*Math.sin(k*2*Math.PI/3)]);
const apex = [0, R + 2*R*Math.sqrt(2/3), 0];
const BALLS = [...base, apex];
const CHK = {};
{ const d = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]); let ok = true;
  for (let i = 0; i < 4; i++) for (let j = i+1; j < 4; j++) ok = ok && Math.abs(d(BALLS[i], BALLS[j]) - 2*R) < 1e-9;
  CHK.touching = ok; if (!ok) console.error('CHK touching failed'); }
function sub(a,b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function dot(a,b){ return a[0]*b[0] + a[1]*b[1] + a[2]*b[2]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function norm(a){ const l = Math.hypot(...a); return a.map(v => v/l); }
const EYE = [0, 3.6, 9.6], LOOK = [0, 1.45, 0], FOC = 1.9;
const CF = norm(sub(LOOK, EYE)), CR = norm(cross(CF, [0,1,0])), CU = cross(CR, CF);
// the same projection the shader uses (uv = (frag - res/2)/res.y, ray = CAM*(uv, FOC))
function proj(p){ const d = sub(p, EYE), z = dot(d, CF);
  return [960 + dot(d, CR)/z*FOC*1080, 540 - dot(d, CU)/z*FOC*1080, z]; }
const clamp01 = x => Math.max(0, Math.min(1, x));
const smooth = x => { x = clamp01(x); return x*x*(3 - 2*x); };

function drawBalls(angle){
  const ca = Math.cos(angle), sa = Math.sin(angle), cs = [];
  for (const [x,y,z] of BALLS) cs.push(ca*x + sa*z, y, -sa*x + ca*z);
  gl.viewport(0, 0, 1920, 1080);
  gl.uniform2f(U('RES'), 1920, 1080);
  gl.uniform3fv(U('C'), new Float32Array(cs));
  gl.uniform1f(U('RAD'), R);
  gl.uniform1i(U('DEPTH'), DEPTH);
  gl.uniform3fv(U('EYE'), EYE);
  gl.uniformMatrix3fv(U('CAM'), false, new Float32Array([...CR, ...CU, ...CF]));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  g.drawImage(glc, 0, 0);
}
const DIR = -1;                          // spin direction: -1 = the front of the pile moves left (like Bowie's and Greg's)
const SPIN = 0.9 * DIR;                  // rad/s
// a glowing ring around the pile with arrowheads riding along it, in the spin direction.
// The back half (behind the balls) is drawn faint first; the front half bright on top.
function drawRing(t, alpha){
  const RY = 1.15, RR = 2.75, N = 160;
  const pt = th => proj([DIR*RR*Math.cos(th), RY, -RR*Math.sin(th)]);   // as th grows, the ring's front moves the spin's way
  const grow = smooth(t / 0.8);                                         // the ring draws itself in
  for (const pass of ['back', 'front']){
    g.save(); g.lineCap = 'round';
    g.shadowColor = 'rgba(255,190,90,0.9)'; g.shadowBlur = pass == 'front' ? 22 : 8;
    g.strokeStyle = `rgba(255,205,120,${alpha * (pass == 'front' ? 0.95 : 0.28)})`;
    g.lineWidth = pass == 'front' ? 7 : 5;
    g.beginPath(); let on = false;
    for (let i = 0; i <= N; i++){
      const th = -Math.PI/2 + 2*Math.PI * grow * i/N, p = pt(th);
      const front = Math.sin(th) < 0;                // toward the camera (z > 0 side)
      if ((pass == 'front') == front){ on ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); on = true; } else on = false;
    }
    g.stroke(); g.restore();
  }
  // arrowheads: 3, evenly spaced, gliding along the ring
  for (let k = 0; k < 3; k++){
    const th = -Math.PI/2 + k*2*Math.PI/3 + t*1.6;
    const p = pt(th), q = pt(th + 0.05), front = Math.sin(th) < 0;
    const a = alpha * smooth((t - 0.6) / 0.4) * (front ? 1 : 0.3);
    if (a <= 0) continue;
    const ang = Math.atan2(q[1] - p[1], q[0] - p[0]), s = front ? 30 : 20;
    g.save(); g.translate(p[0], p[1]); g.rotate(ang);
    g.shadowColor = 'rgba(255,190,90,1)'; g.shadowBlur = 26;
    g.fillStyle = `rgba(255,225,160,${a})`;
    g.beginPath(); g.moveTo(s, 0); g.lineTo(-s*0.75, s*0.7); g.lineTo(-s*0.35, 0); g.lineTo(-s*0.75, -s*0.7); g.closePath(); g.fill();
    g.restore();
  }
}
function drawFrame(t){
  if (SCENE == 'spin'){
    drawBalls(0.35 + SPIN * t);
  } else {                                  // arrows: the same spin, plus the ring saying "turn!"
    drawBalls(0.35 + SPIN * t);
    drawRing(t, 1 - smooth((t - (SCENES.arrows - 0.35)) / 0.35));
  }
}
// CHK.sameWay: the front ball and the ring's front both move the spin's way on screen (left, for DIR = -1)
{ const front = t => { const a = 0.35 + SPIN*t, ca = Math.cos(a), sa = Math.sin(a);
    return BALLS.slice(0,3).map(([x,y,z]) => proj([ca*x + sa*z, y, -sa*x + ca*z])).sort((p,q) => p[2] - q[2])[0][0]; };
  const ring = th => proj([DIR*2.75*Math.cos(th), 1.15, -2.75*Math.sin(th)])[0];
  const ball = Math.sign(front(0.1) - front(0)), arrow = Math.sign(ring(-Math.PI/2 + 0.05) - ring(-Math.PI/2));
  CHK.sameWay = ball == arrow && ball == DIR; if (!CHK.sameWay) console.error('CHK sameWay failed', ball, arrow); }
const T = SCENES[SCENE];
if (P.has('t')) drawFrame(+P.get('t'));
else { const t0 = performance.now(); (function loop(){ drawFrame(((performance.now()-t0)/1000) % T); requestAnimationFrame(loop); })(); }
</script></body></html>
