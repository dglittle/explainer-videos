<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 crystal balls, stacked (WebGL test)</title>
<style>
html,body{margin:0;height:100%;background:#0b0e16;overflow:hidden}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh}
</style></head><body>
<div id="wrap"><canvas id="cv" width="1920" height="1080"></canvas></div>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 RES;
uniform vec3 C[4];      // ball centers (already rotated)
uniform float RAD;      // ball radius
uniform vec3 EYE;
uniform mat3 CAM;
const vec3 L = normalize(vec3(-0.5, 1.0, 0.35));   // light direction
const float IOR = 1.5;
const vec3 GLOW = vec3(1.0, 0.72, 0.28);            // the "diagram" lines inside

float hitSphere(vec3 ro, vec3 rd, vec3 c, float r, out float tFar){
  vec3 oc = ro - c; float b = dot(oc, rd); float h = b*b - dot(oc, oc) + r*r;
  tFar = -1.0;
  if (h < 0.0) return -1.0;
  h = sqrt(h); tFar = -b + h;
  float t = -b - h;
  return t > 1e-3 ? t : -1.0;
}
// capsule (iq): ray vs. segment pa-pb with radius ra
float hitCap(vec3 ro, vec3 rd, vec3 pa, vec3 pb, float ra){
  vec3 ba = pb - pa, oa = ro - pa;
  float baba = dot(ba,ba), bard = dot(ba,rd), baoa = dot(ba,oa), rdoa = dot(rd,oa), oaoa = dot(oa,oa);
  float a = baba - bard*bard, b = baba*rdoa - baoa*bard, c = baba*oaoa - baoa*baoa - ra*ra*baba;
  float h = b*b - a*c;
  if (h >= 0.0){
    float t = (-b - sqrt(h))/a; float y = baoa + t*bard;
    if (y > 0.0 && y < baba) return t;
    vec3 oc = (y <= 0.0) ? oa : ro - pb;
    b = dot(rd, oc); c = dot(oc, oc) - ra*ra; h = b*b - c;
    if (h > 0.0) return -b - sqrt(h);
  }
  return -1.0;
}
vec3 sky(vec3 rd){
  float y = rd.y;
  vec3 c = mix(vec3(0.05,0.06,0.10), vec3(0.16,0.20,0.32), smoothstep(-0.2, 0.8, y));
  c += vec3(1.0,0.95,0.85) * pow(max(dot(rd, L), 0.0), 60.0) * 2.0;           // the lamp
  c += vec3(0.5,0.7,1.0) * smoothstep(0.92, 1.0, dot(rd, normalize(vec3(0.8,0.3,-0.6)))) * 0.6;  // a soft window
  return c;
}
// the floor: dark, faint diagram grid, glassy shadows with a caustic spot
vec3 floorCol(vec3 p, vec3 rd, float t){
  vec2 g = abs(fract(p.xz * 1.0) - 0.5);
  float line = 1.0 - smoothstep(0.0, 0.02 + t*0.002, min(g.x, g.y));
  vec3 c = vec3(0.07,0.08,0.12) + vec3(0.10,0.14,0.22) * line;
  float lightAmt = 1.0, caus = 0.0;
  for (int i = 0; i < 4; i++){
    vec3 oc = p - C[i]; float b = dot(oc, L); float d2 = dot(oc, oc) - b*b;
    if (b < 0.0){
      float q = d2 / (RAD*RAD);
      lightAmt *= mix(0.45, 1.0, smoothstep(0.85, 1.05, q));
      caus += exp(-q * 30.0) * 1.6;
    }
  }
  c *= 0.55 + 0.6 * lightAmt;
  c += vec3(1.0,0.85,0.6) * caus * 0.35;
  return mix(c, sky(rd), smoothstep(8.0, 22.0, t));   // fade into the distance
}
// a cheap second bounce: glass balls shaded once, glowing lines, floor, sky
vec3 trace2(vec3 ro, vec3 rd){
  float best = 1e9; int kind = 0; vec3 n = vec3(0.0); float tf;
  for (int i = 0; i < 4; i++){
    float t = hitSphere(ro, rd, C[i], RAD, tf);
    if (t > 0.0 && t < best){ best = t; kind = 1; n = normalize(ro + rd*t - C[i]); }
  }
  for (int i = 0; i < 4; i++) for (int j = 0; j < 4; j++){ if (j <= i) continue;
    float t = hitCap(ro, rd, C[i], C[j], RAD*0.018);
    if (t > 0.0 && t < best){ best = t; kind = 2; }
  }
  if (rd.y < 0.0){ float t = -ro.y / rd.y; if (t > 0.0 && t < best){ best = t; kind = 3; } }
  if (kind == 1){
    float F = 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
    return mix(sky(refract(rd, n, 1.0/IOR)) * vec3(0.75,0.85,1.0), sky(reflect(rd, n)), F);
  }
  if (kind == 2) return GLOW * 1.0;
  if (kind == 3) return floorCol(ro + rd*best, rd, best);
  return sky(rd);
}
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*RES) / RES.y;
  vec3 ro = EYE, rd = normalize(CAM * vec3(uv, 1.9));
  float best = 1e9; int hit = -1; float tf = 0.0, tFarBest = 0.0;
  for (int i = 0; i < 4; i++){
    float t = hitSphere(ro, rd, C[i], RAD, tf);
    if (t > 0.0 && t < best){ best = t; hit = i; tFarBest = tf; }
  }
  vec3 col;
  float tFloor = rd.y < 0.0 ? -ro.y / rd.y : 1e9;
  if (hit < 0){
    col = tFloor < 1e8 ? floorCol(ro + rd*tFloor, rd, tFloor) : sky(rd);
  } else {
    vec3 c = C[0]; for (int i = 0; i < 4; i++) if (i == hit) c = C[i];
    vec3 p = ro + rd*best, n = normalize(p - c);
    float F = 0.04 + 0.96 * pow(1.0 - max(dot(-rd, n), 0.0), 5.0);
    vec3 refl = trace2(p + n*1e-3, reflect(rd, n));
    // into the glass: maybe hit the glowing lines / center dots inside, else out the far side
    vec3 r1 = refract(rd, n, 1.0/IOR);
    float dummy; hitSphere(p - r1*1e-3, r1, c, RAD, dummy);
    float tExit = dummy;
    float tl = 1e9;
    for (int i = 0; i < 4; i++) for (int j = 0; j < 4; j++){ if (j <= i) continue;
      float t = hitCap(p, r1, C[i], C[j], RAD*0.018);
      if (t > 0.0 && t < tl) tl = t;
    }
    for (int i = 0; i < 4; i++){ float t2; float t = hitSphere(p, r1, C[i], RAD*0.055, t2); if (t > 0.0 && t < tl) tl = t; }
    vec3 refr;
    if (tl < tExit){
      refr = GLOW * 1.1;
    } else {
      vec3 q = p + r1*tExit, n2 = normalize(q - c);
      vec3 r2 = refract(r1, -n2, IOR);
      if (dot(r2, r2) < 0.5) r2 = reflect(r1, -n2);
      refr = trace2(q + r2*2e-3, r2);
    }
    refr *= vec3(0.86, 0.93, 1.0);                       // a hint of blue in the crystal
    col = mix(refr, refl, F);
    col += vec3(1.0) * pow(max(dot(reflect(rd, n), L), 0.0), 400.0) * 3.0;   // highlight
    col += vec3(0.4,0.6,1.0) * pow(1.0 - max(dot(-rd, n), 0.0), 3.0) * 0.25; // rim
  }
  col = col / (1.0 + col * 0.25);                        // soft tone map
  col = pow(col, vec3(0.4545));
  float v = 1.0 - 0.35 * dot(uv*0.9, uv*0.9);             // vignette
  gl_FragColor = vec4(col * v, 1.0);
}
</script>
<script>
const cv = document.getElementById('cv');
const gl = cv.getContext('webgl', {preserveDrawingBuffer: true, antialias: false});
const P = new URLSearchParams(location.search);
const SPIN = +(P.get('spin') || 0.55);     // rad/s around the vertical
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

// 4 touching balls: 3 on the floor in a triangle, 1 on top. Edge = 2r.
const R = 1;
const base = [0,1,2].map(k => [2*R/Math.sqrt(3)*Math.cos(k*2*Math.PI/3), R, 2*R/Math.sqrt(3)*Math.sin(k*2*Math.PI/3)]);
const apex = [0, R + 2*R*Math.sqrt(2/3), 0];
const BALLS = [...base, apex];
const CHK = {};
{ const d = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]); let ok = true;
  for (let i = 0; i < 4; i++) for (let j = i+1; j < 4; j++) ok = ok && Math.abs(d(BALLS[i], BALLS[j]) - 2*R) < 1e-9;
  CHK.touching = ok; if (!ok) console.error('CHK touching failed'); }

function drawFrame(t){
  const a = t * SPIN, ca = Math.cos(a), sa = Math.sin(a);
  const cs = [];
  for (const [x,y,z] of BALLS) cs.push(ca*x + sa*z, y, -sa*x + ca*z);
  // camera: a little above, looking slightly down at the pile
  const eye = [0, 3.6, 9.6], look = [0, 1.45, 0];
  const f = norm(sub(look, eye)), r = norm(cross(f, [0,1,0])), u = cross(r, f);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U('RES'), cv.width, cv.height);
  gl.uniform3fv(U('C'), new Float32Array(cs));
  gl.uniform1f(U('RAD'), R);
  gl.uniform3fv(U('EYE'), eye);
  gl.uniformMatrix3fv(U('CAM'), false, new Float32Array([...r, ...u, ...f]));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function sub(a,b){ return [a[0]-b[0], a[1]-b[1], a[2]-b[2]]; }
function cross(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
function norm(a){ const l = Math.hypot(...a); return a.map(v => v/l); }

if (!P.has('still')){ const t0 = performance.now(); (function loop(){ drawFrame((performance.now()-t0)/1000); requestAnimationFrame(loop); })(); }
else drawFrame(+P.get('still') || 0);
</script></body></html>
